# --- Input specification ---
input:
  mode: "list"   # one of: single | directory | list
  # --- single file mode ---
  source_file: "../../../../asm_examples/examples/sensorVotingSimpleVersion.asm"
  # --- directory mode ---
  source_dir: "data/ase-exp/models/"
  # --- list mode ---
  model_list_file: "data/icst-27-exp/model_list.txt"
  base_dir: "../../../../asm_examples/"

# --- Output configuration ---
output:
  target_folder: "data/icst-27-exp/results/"

# --- Algorithms to run ---
algorithms:
  random:
    run: false
    shuffle: false
    step_list: [10,10,10]
  atgt:
    run: false
  evoavalla:
    run: true
    choose_mode: "pick" # one of: flaky | noShuffle | pick
    jdk_path: "C:/Program Files/Java/jdk-9.0.4"
    budget: 1